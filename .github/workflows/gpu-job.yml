name: GPU job (Kaggle, self-terminating)
on:
  workflow_dispatch:
    inputs:
      job: {description: "script name in gpu/jobs (no .py)", required: true, default: probe}
      args: {description: "JSON args passed to job", required: false, default: "{}"}
      max_minutes: {description: "hard watchdog inside kernel", required: false, default: "10"}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KUSER: tingke
      JOB: ${{ inputs.job }}
      JARGS: ${{ inputs.args }}
      MAXM: ${{ inputs.max_minutes }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q kaggle
      - name: Build kernel
        run: |
          set -e
          SLUG="br-$JOB"
          mkdir k
          python3 - <<'PY'
          import json, os
          e = os.environ
          json.dump({"id": e["KUSER"] + "/br-" + e["JOB"], "title": "br-" + e["JOB"], "code_file": "kernel.py", "language": "python", "kernel_type": "script", "is_private": True, "enable_gpu": True, "enable_internet": True}, open("k/kernel-metadata.json", "w"))
          spec = {"job": e["JOB"], "args": json.loads(e["JARGS"]), "max_minutes": float(e["MAXM"]), "repo": "https://github.com/" + e["REPO"], "sha": e["SHA"]}
          s = open("gpu/runner.py").read()
          open("k/kernel.py", "w").write("JOB_SPEC = r'''" + json.dumps(spec) + "'''\n" + s)
          PY
          echo "SLUG=$SLUG" >> $GITHUB_ENV
      - name: Push and wait (hard-fail)
        run: |
          set -e
          kaggle kernels push -p k
          ok=0
          for i in $(seq 1 180); do
            s=$(kaggle kernels status $KUSER/$SLUG 2>&1 | tail -1); echo "$s"
            case "$s" in
              *COMPLETE*) ok=1; break;;
              *Cannot\ access*|*denied*) echo "STATUS DENIED - wrong owner or token scope"; exit 1;;
              *ERROR*|*CANCEL*) echo "KERNEL FAILED"; mkdir -p kout; kaggle kernels output $KUSER/$SLUG -p kout || true; ls -la kout; tail -80 kout/*.log 2>/dev/null; exit 1;;
            esac
            sleep 20
          done
          test $ok = 1 || { echo "poll timeout"; exit 1; }
          mkdir -p kout; kaggle kernels output $KUSER/$SLUG -p kout
          ls -laR kout
          for f in $(find kout -name '*.json' -o -name '*.log'); do echo "== $f"; head -c 6000 $f; echo; done
          test -f kout/DONE.ok || { echo "no DONE.ok marker"; tail -80 kout/*.log; exit 1; }
      - name: Publish outputs as release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="gpu-$JOB-${{ github.run_number }}"
          files=$(find kout/out -type f)
          test -n "$files" || { echo "no output files"; exit 1; }
          gh release create "$tag" --title "$tag" --notes "gpu job output" $files
          echo "RELEASE $tag"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-${{ inputs.job }}
          path: kout
